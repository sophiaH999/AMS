<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone- portal game</title>
</head>
<body>
    <header class="topo">
        <div class="container">
            <div class="logo"> GAME <span>ZONE</span></div>
            <nav class="menu">
                <a href="#inicio"> Início</a>
                <a href="#jogos">Jogos</a>
                <a href="#noticias">Notícias</a>
                <a href="#contato">Contato</a>
            </nav>
        </div>
    </header>
    
    <main>
        <section class="hero" id="inicio">
            <div class="container hero-conteudo">
                <div>
                    <p class="tag">PORTAL GAMER</p>
                    <h1>O universo dos games em um só lugar</h1>
                    <p>
                        Descubra novos jogos, confira lançamentos e acompanhe as principais novidades do mundo gamer.
                    </p>
                    <a class="botao" href="#jogos">Explrar jogos</a>
                </div>
                <div class="controle"></div>
            </div>
        </section>
         
        <section class="secao" id="jogos">
            <div class="container">
                <h2>Jogos em destaque</h2>
                <p class="subtitulo">Alguns dos titulos mais procurados prlos jogadores</p>
                <div class="jogos-grid">
                    <article class="card">
                        <div class="capa"></div>
                        <div class="card-conteudo">
                            <span class="categoria">RPG</span>

                        </div>
                    </article>

                </div>
            </div>

        </section>
    </main>
</body>
</html>
