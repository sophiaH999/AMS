<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <meta name="description"content="formulario de contato dev">
    <meta name="keywords"content="HTML,CSS,formulario, contato">
    <link rel="stylesheet" href="css/reset.css">
</head>
<body>
    <main>
        <div class="header">
            <h1 id="titulo">Cadastro de DEvs</h1>
            <p id="subtitulo">Complete suas informações</p>
        </div>
        <form action="#" method="post" autocomplete="off">
            <fieldset class="grupo">
                <div class="campo">
                    <label for="nome"><strong>nome</strong></label>
                    <input type="text" name="sobrenome" id="sobrenome" required>
                </div>
            </fieldset>

            <div class="campo">
                <label for="email"><strong>EMAIL</strong></label>
                <input type="email" name="email" id="email"required>
            </div>
            <div class="campo">
                <label><strong>De qual lado da aplicação você desenvolve</strong></label>
                <label>
                    <input type="radio" name="devweb" value="frontend" checked>
                    front-end
                </label>
                <label>
                    <input type="radio" name="devweb" value="backend"> backend
                    Fullstack
                </label>
            </div>
            <div class="campo">
                <label for="senioridade"><strong>serioridade</strong></label>
                <select name="senioridade" id="senioridade">
                    <option value="junior">Junior</option>
                    <option value="pleno">Pleno</option>
                    <option value="senior">Senior</option>
            </div>
                </select>
                <fieldset class="grupo">
                    <legend><strong>selecione as tecnologias que utiliza:</strong></legend>
                    <label>
                        <input type="checkbox" name="tecnologia" value="html">HTML
                    </label>
                    <label>
                        <input type="checkbox" name="tecnologia" value="css">CSS
                    </label>
                    <label>
                        <input type="checkbox" name="tecnologia" value="javascript">javascript
                    </label>
                    <label>
                        <input type="checkbox" name="tecnologia" value="php">PHP
                    </label>
                    <label> 
                        <input type="checkbox" name="tecnologia" value="csharp">C#
                    </label>
                    <label >
                        <input type="checkbox" name="tecnologia" value="python">Python
                    </label>
                    <label>
                        <input type="checkbox" name="tecnologia" value="java">Java
                    </label>
                </fieldset>
                <div class="campo">
                    <label for="experiencia"><strong>conte um pouco da sua experiência</strong></label>
                    <textarea name="experiencia" id="experiencia" rows="6" cols="47" placeholder="Descreva sua experiencia profissional..."></textarea>
                </div>
                <div class="button">
                    <button class="button" type="submit">Concluido</button>

                </div>

        </form>
    </main>
    <footer class="footer-center">
        <p>&copy; 2026 Cadastro de desenvolvedores. Todos os direitos reservados.</p>
    </footer>
    
</body>
</html>
